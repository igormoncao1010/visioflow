<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f8f6" />
  <meta name="description" content="VisioFlow conecta instituições, clínicas e óticas em uma jornada visual mais simples." />
  <title>VisioFlow — Gestão visual, conectada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <section class="auth-gate" id="authGate" hidden aria-labelledby="authTitle"></section>
  <div class="app-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="VisioFlow início">
        <span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 20c4.6-7 9.9-10.5 16-10.5S31.4 13 36 20c-4.6 7-9.9 10.5-16 10.5S8.6 27 4 20Z"/><circle cx="20" cy="20" r="5.2"/><path class="spark" d="M31 7v6M28 10h6"/></svg></span>
        <span class="brand-name">visio<span>flow</span><small>GESTÃO VISUAL CONECTADA</small></span>
      </a>
      <div class="workspace-label">ESPAÇO DE TRABALHO</div>
      <button class="workspace-switch" id="workspaceSwitch"><span class="workspace-avatar">VC</span><span><strong id="workspaceName">Visão Clínica</strong><small id="workspaceType">Clínica parceira</small></span><span class="chevron">⌄</span></button>
      <div class="nav-label">MENU PRINCIPAL</div>
      <nav class="main-nav" id="mainNav" aria-label="Menu principal"></nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon">✦</div><strong>Precisa de ajuda?</strong><p>Nosso time está aqui para você.</p><button id="helpButton">Falar com suporte <span>↗</span></button></div>
        <button class="profile-button" id="logoutButton"><span class="profile-avatar" id="profileInitials">MC</span><span><strong id="profileName">Marina Costa</strong><small id="profileRole">Administradora</small></span><span class="more">Sair</span></button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Abrir menu">☰</button>
        <div class="breadcrumbs"><span>VisioFlow</span><span class="slash">/</span><strong id="breadcrumb">Visão geral</strong></div>
        <div class="topbar-actions"><span class="live-pill"><i></i> Ambiente de demonstração</span><button class="icon-button" id="notificationsButton" aria-label="Notificações">♧<i class="notification-dot"></i></button><div class="top-divider"></div><span class="top-user"><b id="topInitials">MC</b><span><span id="topUserName">Marina Costa</span><small>Administradora</small></span></span></div>
      </header>
      <div class="content" id="content"></div>
      <footer>© 2025 VisioFlow <span>•</span> Cuidado visual, conectado.</footer>
    </main>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section></div>
  <script src="/app.js" defer></script>
  <script src="/workflows.js" defer></script>
  <script src="/supabase-config.js" defer></script>
  <script src="/supabase-live.js" defer></script>
</body>
</html>
